[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zordon"
# Single source of truth: zordon/__init__.py ``__version__`` (read by hatchling below).
dynamic = ["version"]
description = "Full-duplex voice interface for a Claude Code session running in tmux: talk to it, hear it back, interrupt it."
readme = "README.md"
license = { text = "MIT" }
# The core package runs on any 3.12+; only kokoro-onnx (the [local] extra) is capped at <3.14.
requires-python = ">=3.12"
authors = [{ name = "Jeremiah Carreon" }]
keywords = ["voice", "tmux", "claude-code", "speech", "tts", "stt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115",
  # 0.35 is the first release with the ``websockets-sansio`` implementation that
  # transport/server.py selects (ws="websockets-sansio") and with keepalive pings in it.
  "uvicorn[standard]>=0.35",
  "pydantic>=2.7",
  "anthropic>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "segno>=1.6",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
# Local, private speech stack (default providers). Pulls CTranslate2 and the Kokoro ONNX runtime.
# kokoro-onnx declares <3.14 itself; the marker keeps `zordon[local]` resolvable on 3.14
# (faster-whisper still installs) and `zordon doctor` explains the missing TTS.
local = [
  "faster-whisper>=1.0",
  "kokoro-onnx>=0.4; python_version < '3.14'",
]
# Jev (TypeSafe System One) router. 0.7.2 added the http2 extra; 0.8 is unreleased (decision 0006).
jev = ["typesafe-sdk>=0.7.2,<0.8"]
# Optional host-side mic/speaker when the agent runs on the same machine as the browser.
hostaudio = ["sounddevice>=0.4"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "websockets>=12",
]

[project.scripts]
zordon = "zordon.cli:main"

[project.urls]
Homepage = "https://github.com/jeremiahcarreon/zordon"
Issues = "https://github.com/jeremiahcarreon/zordon/issues"

[tool.hatch.version]
path = "zordon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zordon"]

[tool.hatch.build.targets.sdist]
include = ["zordon", "docs", "eval", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "integration: needs tmux (a private server is started); runs by default, deselect with -m 'not integration'",
  "provider: needs a configured provider API key or local model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
